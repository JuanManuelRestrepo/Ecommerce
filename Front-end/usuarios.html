<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/usuarios.css">
</head>
<body>

    <!-- Barra lateral -->
    <aside class="sidebar">
        <div class="logo-container">
            <h1>CartsKing</h1>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html" class="nav-item"><i class="fas fa-plus"></i><span>Principal</span></a></li>
                <li><a href="usuarios.html" class="nav-item"><i class="fas fa-user"></i><span>Usuarios</span></a></li>
                <li><a href="carrito.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Carrito</span></a></li>
                <li><a href="ajustes.html" class="nav-item"><i class="fas fa-cog"></i><span>Ajustes</span></a></li>
            </ul>
        </nav>
    </aside>

    <!-- Contenedor principal del perfil de usuario -->
    <main class="user-profile">
        <section class="user-description">
            <div class="profile-picture">
                <img src="https://www.blogdelfotografo.com/wp-content/uploads/2022/01/retrato-anillo-luz.webp" alt="Foto de usuario">
            </div>
            <div class="profile-info">
                <h2>Andres Dussan</h2>
                <p id="user-bio">Hola, mi nombre es Andres Dussan, manejo una distribuidora nacional. Son productos deportivos, diseñados para satisfacer las necesidades de nuestros clientes...</p>
                <button id="toggle-bio">Leer más...</button>
            </div>
        </section>

        <!-- Formulario para agregar productos -->
        <section id="agregar-producto">
            <h3>Agregar Producto</h3>
            <form id="add-product-form">
                <input type="text" id="product-name" placeholder="Nombre del Producto" required>
                <textarea id="product-description" placeholder="Descripción" required></textarea>
                <input type="number" id="product-price" placeholder="Precio" required>
                <input type="number" id="product-quantity" placeholder="Cantidad de productos" required>
                <input type="text" id="product-image" placeholder="URL de la imagen" required>
            
                <select id="categoria">
                    <option value="deporte">Deporte</option>
                    <option value="vehiculos">Vehículos</option>
                    <option value="ropa">Ropa</option>
                    <option value="hogar">Hogar</option>
                    <option value="accesorios">Accesorios</option>
                    <option value="tecnologia">Tecnología</option>
                    <option value="belleza">Belleza</option>
                </select>
            
                <button type="submit">Agregar Producto</button>
            </form>
        </section>

        <!-- Lista de productos -->
        <section id="productos" class="products-section">
            <h3>Productos</h3>
            <div id="lista-productos" class="product-list">
                <!-- Aquí se cargarán los productos almacenados en localStorage -->
            </div>
        </section>
    </main>

    <script src="js/usuarios.js"></script>
</body>
</html>
