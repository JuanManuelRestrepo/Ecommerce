<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/carrito.css">
</head>
<body>

    <!-- Barra lateral -->
    <aside class="sidebar">
        <div class="logo-container">
            <h1>CartsKing</h1>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html" class="nav-item"><i class="fas fa-plus"></i><span>Principal</span></a></li>
                <li><a href="usuarios.html" class="nav-item"><i class="fas fa-user"></i><span>Usuarios</span></a></li>
                <li><a href="carrito.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Carrito</span></a></li>
                <li><a href="ajustes.html" class="nav-item"><i class="fas fa-cog"></i><span>Ajustes</span></a></li>
            </ul>
        </nav>
    </aside>

    <!-- Contenedor principal del perfil de usuario -->
    <main class="user-profile">
        <section class="user-description">
            <div class="profile-picture">
                <img src="https://www.blogdelfotografo.com/wp-content/uploads/2022/01/retrato-anillo-luz.webp" alt="Foto de usuario">
            </div>
            <div class="profile-info">
                <h2>Andres Dussan</h2>
                <p id="user-bio"></p>
            </div>
        </section>

        <!-- Formulario para agregar productos -->
        <section id="agregar-producto">

        </section>

        <!-- Lista de productos -->
        <section id="productos" class="products-section">
            <h3>Productos Agregados al carrito</h3>
            <div id="lista-productos" class="product-list">
                <!-- Aquí se cargarán los productos almacenados en localStorage -->
                <div class="productos-agregados">
                    <img src="https://static.vecteezy.com/system/resources/previews/010/161/408/original/3d-rendering-magnifying-glass-with-question-mark-icon-symbol-isolated-png.png" alt="Imagen de computadora con signo de interrogación">
                    <p>¡Haz tu primera compra!<br>Aquí podrás ver tus compras y hacer el seguimiento de tus envíos.</p>
                    <a href="dashboard.html" class="ver-ofertas">Ver ofertas del día</a>
                </div>
            </div>
        </section>
        
    </main>

    <script src="js/.js"></script>
</body>
</html>
