<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/carrito.css"> <!-- Archivo CSS compartido -->
</head>
<body>
    <!-- Contenedor Principal -->
    <div class="layout">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <div class="logo-container">
                <h1>CartsKing</h1>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" class="nav-item"><i class="fas fa-plus"></i><span>Principal</span></a></li>
                    <li><a href="usuarios.html" class="nav-item"><i class="fas fa-user"></i><span>Perfil</span></a></li>
                    <li><a href="carrito.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Carrito</span></a></li>
                    <li><a href="ajustes.html" class="nav-item"><i class="fas fa-cog"></i><span>Ajustes</span></a></li>
                    <li><a href="Pedidos.html" class="nav-item"><i class="fas fa-cog"></i><span>Pedidos</span></a></li>
                    <li><a href="#" id="logout-btn" class="nav-item"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="top-bar">
                <h1>Carrito de Compras</h1>
            </header>

            <!-- Contenedor del carrito -->
            <div id="cart-container" class="cart-container">
                <!-- Aquí se listarán los productos del carrito -->
            </div>

            <!-- Total del carrito -->
            <div class="cart-total">
                <h2>Total: $<span id="cart-total">0.00</span></h2>
                <button id="checkout-btn">Proceder al Pago</button>
                <button id="place-order-btn">Realizar Pedido</button> <!-- Nuevo botón -->
            </div>
        </main>
    </div>

    <!-- Script principal -->
    <script src="../js/carrito.js"></script>
</body>
</html>
