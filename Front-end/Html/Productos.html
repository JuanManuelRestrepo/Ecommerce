<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="../css/Productos.css">
</head>
<body>
    <section id="gestionar-productos">
        <h3>Gestionar Productos</h3>
        
        <!-- Formulario de creación de producto -->
        <form id="product-form">
            <input type="text" id="product-name" placeholder="Nombre del Producto" required>
            <textarea id="product-description" placeholder="Descripción" required></textarea>
            <input type="number" id="product-price" placeholder="Precio" required>
            <input type="number" id="product-quantity" placeholder="Cantidad disponible" required>
            <select id="categoria"></select>
            <select id="Proveedor"></select>
            <button type="submit" id="crear-producto">Crear Producto</button>
        </form>

        <h3>Productos Disponibles</h3>
        <ul id="product-list">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </ul>
    </section>

    <!-- Modal para actualizar el producto -->
    <div id="update-product-modal" class="modal">
        <div class="modal-content">
            <h3>Actualizar Producto</h3>
            <form id="update-product-form">
                <input type="text" id="update-product-name" placeholder="Nombre del Producto" required>
                <textarea id="update-product-description" placeholder="Descripción" required></textarea>
                <input type="number" id="update-product-price" placeholder="Precio" required>
                <input type="number" id="update-product-quantity" placeholder="Cantidad disponible" required>
                <select id="update-categoria"></select>
                <select id="update-Proveedor"></select>
                <button type="submit" id="update-product-btn">Actualizar Producto</button>
                <button type="button" id="close-modal-btn">Cerrar</button>
            </form>
        </div>
    </div>

    <script src="../js/Productos.js"></script>
</body>
</html>
